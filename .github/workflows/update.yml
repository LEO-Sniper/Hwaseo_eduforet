name: Update and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,9,23 * * *' # UTC -> Korea 13:00, 18:00, 08:00 (next day)
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eduforet-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check data logic
        run: python -m unittest discover -s tests
      - name: Fetch complete official snapshot
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/update_data.py
      - name: Save successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/trades.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official trade snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
